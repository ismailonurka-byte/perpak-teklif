# Render Blueprint — Web Service (Docker) + ücretsiz PostgreSQL (demo)
# https://render.com/docs/blueprint-spec
# NOT: Render free Postgres ~30 günde silinir + veri bulutta → yalnız DEMO içindir.
#      Kalıcı/gizli veri on-prem Postgres'te tutulur.
databases:
  - name: vanto-db
    plan: free
    databaseName: perpak_teklif
    user: perpak
    region: frankfurt

services:
  - type: web
    name: perpak-teklif
    runtime: docker
    plan: free
    region: frankfurt        # Avrupa için en yakın free region
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # PostgreSQL bağlantısı (Render free DB'den otomatik gelir).
      # Render 'postgres://...' verir; kod 'postgresql+psycopg://'ye normalize eder.
      - key: DATABASE_URL
        fromDatabase:
          name: vanto-db
          property: connectionString
      - key: APP_NAME
        value: Vanto
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        value: "*"
      - key: SMTP_ENABLED
        value: "false"
      # Demo veriyi (örnek müşteri/teklif/kullanıcı) tohumla — Postgres kalıcı olduğundan
      # bir kez basılır; idempotent (var olanı tekrar eklemez).
      - key: SEED_DEMO
        value: "true"
    healthCheckPath: /health
